[package]
name = "libtakt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]
name = "libtakt"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-cron-scheduler = "0.15"
croner = "4"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1"
regex = "1"
thiserror = "2"
async-trait = "0.1"
dirs = "7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSObject", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
block2 = "0.6"
core-graphics = "0.25"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
